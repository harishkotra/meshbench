[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshbench"
version = "0.1.0"
description = "Local devnet, live inspector and MCP bridge for the Offline Protocol Mesh SDK"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Harish Kotra" }]
dependencies = [
  "aiohttp>=3.9",
  "websockets>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]
sdk = ["offline-protocol-sdk[lan,http]==0.33.0"]

[project.scripts]
meshbench = "meshbench.cli:main"

[tool.setuptools.packages.find]
include = ["meshbench*"]

[tool.setuptools.package-data]
meshbench = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
